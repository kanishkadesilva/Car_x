<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Street Drive - Road Control</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050505;font-family:Arial,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100%;max-width:520px;margin:auto;overflow:hidden;background:#6d9e55;color:white}
.sky{position:absolute;inset:0 0 43%;background:linear-gradient(#78bee9,#dff3ff)}
.city{position:absolute;left:0;right:0;bottom:42%;height:24%;background:repeating-linear-gradient(90deg,#68737d 0 35px,transparent 35px 54px,#8e989f 54px 82px,transparent 82px 105px);opacity:.9}
.ground{position:absolute;inset:57% 0 0;background:linear-gradient(#699b53,#456f3b)}
.road{position:absolute;left:5%;right:5%;top:41%;bottom:-5%;background:#3d4145;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);box-shadow:inset 0 0 0 4px #eee}
.road:before,.road:after{content:"";position:absolute;top:0;bottom:0;width:4px;background:white}.road:before{left:18%}.road:after{right:18%}
.lane{position:absolute;z-index:3;top:43%;left:50%;width:5px;height:100px;background:#fff;transform:translateX(-50%)}
#lane2{left:43%}#lane3{left:57%}
.toll{position:absolute;z-index:4;top:31%;left:8%;right:8%;height:12%;background:linear-gradient(#ddd,#8c9296);border:2px solid #555;border-radius:8px 8px 0 0}
.toll b{display:block;text-align:center;padding-top:10px;font-size:22px;color:#444}
.barrier{position:absolute;z-index:5;top:39%;left:18%;right:18%;height:10px;background:#d52e2e;border:2px solid white;transform:skewX(-7deg)}
#hud{position:absolute;z-index:30;top:8px;left:8px;right:8px;display:flex;justify-content:space-between}
.box{background:#050505b8;border:1px solid #fff4;border-radius:10px;padding:7px 10px;font-weight:800}
#dash{position:absolute;z-index:30;top:7px;left:50%;transform:translateX(-50%);width:118px;height:82px;border-radius:50%;background:radial-gradient(circle,#273038 0 43%,#090b0d 44%);border:5px solid #c5c8ca}
#needle{position:absolute;left:55px;top:13px;width:3px;height:30px;background:#e33;transform-origin:50% 100%;transform:rotate(-55deg)}
#km{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px}
#car{position:absolute;z-index:15;left:50%;bottom:116px;transform:translateX(-50%);width:122px;height:190px;filter:drop-shadow(0 12px 8px #0009)}
.body{position:absolute;inset:10px 8px 0;border-radius:42px 42px 22px 22px;background:linear-gradient(90deg,#08090a,#51585d 30%,#0b0c0d 50%,#51585d 70%,#08090a);border:2px solid #899096}
.roof{position:absolute;left:18px;right:18px;top:20px;height:78px;border-radius:38px 38px 15px 15px;background:#1d3544;border:2px solid #222}
.wind{position:absolute;left:8px;right:8px;top:8px;height:40px;border-radius:28px 28px 6px 6px;background:linear-gradient(135deg,#c4e9fa,#1c3c50)}
.rear{position:absolute;left:14px;right:14px;bottom:21px;height:42px;border-radius:12px;background:#111}
.light{position:absolute;bottom:30px;width:30px;height:10px;border-radius:7px;background:#e52d32;box-shadow:0 0 12px #f22}.light.l{left:10px}.light.r{right:10px}
.exhaust{position:absolute;bottom:8px;width:17px;height:10px;border-radius:50%;background:#050505;border:2px solid #777}.exhaust.l{left:26px}.exhaust.r{right:26px}
.traffic{position:absolute;z-index:12;width:64px;height:110px;border-radius:17px;background:linear-gradient(90deg,#111,#aeb5ba 45%,#222);border:2px solid #777}
.traffic:before{content:"";position:absolute;left:9px;right:9px;top:12px;height:34px;border-radius:10px;background:#203a49}
.traffic:after{content:"";position:absolute;left:10px;right:10px;bottom:10px;height:8px;background:#ef3038;border-radius:6px}
#t1{top:48%;left:29%}#t2{top:54%;left:61%;transform:scale(.82)}
#mini{position:absolute;z-index:31;left:9px;bottom:110px;width:78px;height:78px;border-radius:50%;background:#18221b;border:3px solid #ddd}
#mini:after{content:"";position:absolute;left:34px;top:34px;width:9px;height:9px;border-radius:50%;background:#20d66d;box-shadow:0 0 8px #20d66d}
#steer{position:absolute;z-index:35;right:10px;bottom:108px;width:112px;height:112px;border-radius:50%;border:11px solid #25282b;box-shadow:inset 0 0 0 3px #ccc;background:radial-gradient(circle,#111 0 15%,transparent 16%),conic-gradient(#ccc,#222 25%,#ccc 45%,#222 70%,#ccc)}
#controls{position:absolute;z-index:40;left:8px;right:8px;bottom:12px;height:92px}
.ctrl{position:absolute;border:2px solid #fff4;color:white;background:#111b;border-radius:50%;width:64px;height:64px;font-size:25px;font-weight:900}.ctrl:active{background:#444}
#left{left:5px;bottom:8px}#right{left:77px;bottom:8px}
#brake{right:80px;bottom:0;width:56px;height:80px;border-radius:15px;font-size:12px}#gas{right:10px;bottom:0;width:56px;height:80px;border-radius:15px;font-size:12px}
#start,#over{position:absolute;z-index:100;inset:0;background:#000a;display:flex;align-items:center;justify-content:center}.panel{width:86%;max-width:380px;text-align:center;background:#111e;padding:28px;border-radius:22px;border:1px solid #fff3;backdrop-filter:blur(8px)}h1{margin:0 0 8px;font-size:35px}p{color:#ddd;margin:8px 0 20px}.main{border:0;border-radius:14px;padding:14px 24px;font-size:18px;font-weight:900}#over{display:none}
</style>
</head>
<body>
<div id="game">
<div class="sky"></div><div class="city"></div><div class="ground"></div><div class="road"></div>
<div class="lane" id="lane1"></div><div class="lane" id="lane2"></div><div class="lane" id="lane3"></div>
<div class="toll"><b>ROAD CONTROL</b></div><div class="barrier"></div>
<div id="hud"><div class="box">💰 3,500</div><div class="box" id="score">SCORE 0</div></div>
<div id="dash"><div id="needle"></div><b id="km">0 KM/H</b></div>
<div class="traffic" id="t1"></div><div class="traffic" id="t2"></div>
<div id="mini"></div>
<div id="car"><div class="body"><div class="roof"><div class="wind"></div></div><div class="rear"></div><div class="light l"></div><div class="light r"></div><div class="exhaust l"></div><div class="exhaust r"></div></div></div>
<div id="steer"></div>
<div id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button><button class="ctrl" id="brake">BRAKE</button><button class="ctrl" id="gas">GAS</button></div>
<div id="start"><div class="panel"><h1>STREET DRIVE</h1><p>Traffic • Road Control • Steering • Speed</p><button class="main" id="play">START DRIVE</button></div></div>
<div id="over"><div class="panel"><h1>CRASH!</h1><p id="result"></p><button class="main" id="again">DRIVE AGAIN</button></div></div>
</div>
<script>
const game=document.getElementById('game'),car=document.getElementById('car'),scoreEl=document.getElementById('score'),km=document.getElementById('km'),needle=document.getElementById('needle');
let running=false,x=.5,score=0,spd=5,last=0,keys={left:false,right:false,gas:false,brake:false};
function move(d){x=Math.max(.22,Math.min(.78,x+d*.012));car.style.left=(x*100)+'%'}
function hit(a,b){let A=a.getBoundingClientRect(),B=b.getBoundingClientRect();return A.left<B.right&&A.right>B.left&&A.top<B.bottom&&A.bottom>B.top}
function loop(t){if(!running)return;let dt=Math.min(35,t-last);last=t;
if(keys.left)move(-dt/16);if(keys.right)move(dt/16);
if(keys.gas)spd=Math.min(13,spd+.015*dt);else if(keys.brake)spd=Math.max(2,spd-.035*dt);else spd=Math.min(8,spd+.002*dt);
document.querySelectorAll('.lane').forEach((e,i)=>e.style.top=(42+(((t*spd/13+i*220)%620)-80)/10)+'%');
document.querySelectorAll('.traffic').forEach((e,i)=>{let y=e.getBoundingClientRect().top+spd*dt/16;e.style.top=y+'px';if(y>game.clientHeight+50){score++;scoreEl.textContent='SCORE '+score;e.style.top=(-130-Math.random()*180)+'px';e.style.left=(25+Math.random()*50)+'%'}});
if([...document.querySelectorAll('.traffic')].some(e=>hit(car,e))){running=false;document.getElementById('result').textContent='Your score: '+score;document.getElementById('over').style.display='flex';return}
km.textContent=Math.round(spd*17)+' KM/H';needle.style.transform='rotate('+(-65+spd*11)+'deg)';requestAnimationFrame(loop)}
function start(){running=true;score=0;spd=5;x=.5;scoreEl.textContent='SCORE 0';document.getElementById('start').style.display='none';document.getElementById('over').style.display='none';last=performance.now();requestAnimationFrame(loop)}
function bind(id,k){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))}
bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key==='ArrowUp')keys.gas=true;if(e.key==='ArrowDown')keys.brake=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.key==='ArrowUp')keys.gas=false;if(e.key==='ArrowDown')keys.brake=false});
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;
</script>
</body></html>
