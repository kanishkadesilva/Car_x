<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Dodge</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#111;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}

.game{
  width:100%;
  max-width:400px;
  height:100vh;
  max-height:700px;
  background:#333;
  position:relative;
  overflow:hidden;
}

.score{
  position:absolute;
  top:15px;
  left:15px;
  color:white;
  font-size:22px;
  font-weight:bold;
  z-index:10;
}

.road{
  width:100%;
  height:100%;
  background:#292929;
  position:relative;
}

.line{
  position:absolute;
  width:8px;
  height:80px;
  background:white;
  left:50%;
  transform:translateX(-50%);
  opacity:.8;
}

.car{
  position:absolute;
  bottom:80px;
  width:55px;
  height:90px;
  background:#e60000;
  border-radius:12px;
  left:calc(50% - 27px);
  z-index:5;
  box-shadow:0 0 15px #ff3333;
}

.car:before,
.enemy:before{
  content:"";
  position:absolute;
  width:38px;
  height:28px;
  background:#8ed8ff;
  left:8px;
  top:12px;
  border-radius:7px;
}

.enemy{
  position:absolute;
  width:55px;
  height:90px;
  background:#0066ff;
  border-radius:12px;
  top:-100px;
  z-index:4;
}

.controls{
  position:absolute;
  bottom:15px;
  width:100%;
  display:flex;
  justify-content:space-around;
  z-index:20;
}

button{
  width:120px;
  height:55px;
  border:none;
  border-radius:15px;
  font-size:25px;
  font-weight:bold;
  background:white;
}

.gameover{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.85);
  color:white;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:50;
}

.gameover h1{
  font-size:42px;
  margin-bottom:15px;
}

.gameover button{
  margin-top:20px;
  background:#00d26a;
  color:white;
}
</style>
</head>

<body>

<div class="game">

  <div class="score">
    Score: <span id="score">0</span>
  </div>

  <div class="road" id="road">

    <div class="line" style="top:-100px"></div>
    <div class="line" style="top:100px"></div>
    <div class="line" style="top:300px"></div>
    <div class="line" style="top:500px"></div>

    <div class="car" id="car"></div>

    <div class="enemy" id="enemy"></div>

  </div>

  <div class="controls">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
  </div>

  <div class="gameover" id="gameover">
    <h1>GAME OVER</h1>
    <div>Your Score: <span id="finalScore">0</span></div>
    <button onclick="restart()">RESTART</button>
  </div>

</div>

<script>

const car = document.getElementById("car");
const enemy = document.getElementById("enemy");
const scoreText = document.getElementById("score");
const gameover = document.getElementById("gameover");
const finalScore = document.getElementById("finalScore");

let carX = 50;
let enemyX = 50;
let enemyY = -100;
let score = 0;
let speed = 5;
let playing = true;

function moveCar(direction){

  if(!playing) return;

  carX += direction * 8;

  if(carX < 7) carX = 7;
  if(carX > 93) carX = 93;

  car.style.left = `calc(${carX}% - 27px)`;
}

document.getElementById("left")
.addEventListener("touchstart", e=>{
  e.preventDefault();
  moveCar(-1);
});

document.getElementById("right")
.addEventListener("touchstart", e=>{
  e.preventDefault();
  moveCar(1);
});

document.addEventListener("keydown", e=>{

  if(e.key === "ArrowLeft"){
    moveCar(-1);
  }

  if(e.key === "ArrowRight"){
    moveCar(1);
  }

});

function randomEnemy(){

  enemyX = Math.floor(Math.random()*80)+10;
  enemyY = -100;

  enemy.style.left = `calc(${enemyX}% - 27px)`;
}

function collision(){

  const carRect = car.getBoundingClientRect();
  const enemyRect = enemy.getBoundingClientRect();

  return !(
    carRect.bottom < enemyRect.top ||
    carRect.top > enemyRect.bottom ||
    carRect.right < enemyRect.left ||
    carRect.left > enemyRect.right
  );
}

function gameLoop(){

  if(!playing) return;

  enemyY += speed;
  enemy.style.top = enemyY + "px";

  if(collision()){
    endGame();
    return;
  }

  if(enemyY > 750){

    score++;
    scoreText.textContent = score;

    if(score % 5 === 0){
      speed += 1;
    }

    randomEnemy();
  }

  requestAnimationFrame(gameLoop);
}

function endGame(){

  playing = false;

  finalScore.textContent = score;
  gameover.style.display = "flex";
}

function restart(){

  score = 0;
  speed = 5;
  playing = true;

  scoreText.textContent = "0";
  gameover.style.display = "none";

  randomEnemy();
  gameLoop();
}

randomEnemy();
gameLoop();

</script>

</body>
</html>
